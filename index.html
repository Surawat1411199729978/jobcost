<!DOCTYPE html>
<html lang="th"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<style>
:root{--bg:#f2f2f7;--card:#fff;--ink:#000;--sub:#6e6e73;--faint:#8e8e93;--line:rgba(60,60,67,.18);--fill:rgba(118,118,128,.12);--acc:#007aff;--acc-soft:rgba(0,122,255,.12);
  --ok:#34c759;--ok-soft:rgba(52,199,89,.15);--warn:#ff9500;--warn-soft:rgba(255,149,0,.15);--bad:#ff3b30;--bad-soft:rgba(255,59,48,.12);--sheet:#f2f2f7;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--ink:#fff;--sub:#98989f;--faint:#8d8d93;--line:rgba(84,84,88,.6);--fill:rgba(118,118,128,.24);--acc:#0a84ff;--acc-soft:rgba(10,132,255,.2);--ok:#30d158;--ok-soft:rgba(48,209,88,.2);--warn:#ff9f0a;--warn-soft:rgba(255,159,10,.2);--bad:#ff453a;--bad-soft:rgba(255,69,58,.2);--sheet:#1c1c1e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Noto Sans Thai",sans-serif;font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;color:var(--ink)}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:.92em;letter-spacing:0}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);padding:var(--safe-t) 0 0}
header.sc{border-bottom:.5px solid var(--line)}
.hin{max-width:720px;margin:0 auto;padding:0 16px}
.nav{height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.back{justify-self:start;color:var(--acc);font-size:17px;display:flex;visibility:hidden;align-items:center;gap:2px;margin-left:-6px;white-space:nowrap}
.back svg{flex:none}
.back.on{visibility:visible}
.ntitle{font-size:17px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw;opacity:0;transition:opacity .15s}
header.sc .ntitle.on{opacity:1}
.navr{justify-self:end;display:flex;gap:14px;align-items:center}
.who{color:var(--acc);font-size:16px;display:none;align-items:center;gap:4px;max-width:40vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.add{color:var(--acc);display:none}
.add.on,.who.on{display:flex}
h1{margin:2px 0 0;font-size:34px;font-weight:700;letter-spacing:.01em;line-height:1.2}
.sub{font-size:15px;color:var(--sub);margin-top:2px}
#tools{padding-bottom:8px}
.sbar{display:flex;gap:8px;margin-top:10px;align-items:center}
.search{flex:1;position:relative}
.search input{width:100%;border:0;background:var(--fill);border-radius:10px;padding:8px 10px 8px 32px;font-size:17px;outline:none;-webkit-appearance:none;appearance:none}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--faint)}
.fbtn{flex:none;color:var(--acc);font-size:17px;display:flex;align-items:center;gap:6px}
.fbtn b{background:var(--acc);color:#fff;border-radius:999px;font-size:12px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chips:empty{display:none}
.chip{display:flex;align-items:center;gap:5px;background:var(--acc-soft);color:var(--acc);border-radius:999px;padding:4px 10px;font-size:14px;font-weight:500}
.chip span{font-size:13px;opacity:.75}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin-top:10px}
.seg button{flex:1;padding:6px 3px;border-radius:7px;font-size:clamp(12px,3.4vw,14px);font-weight:500;white-space:nowrap}
.seg button.on{background:var(--card);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04)}
main{padding:8px 16px calc(var(--safe-b) + 40px);max-width:720px;margin:0 auto}
.gh{font-size:13px;color:var(--sub);text-transform:uppercase;letter-spacing:.02em;margin:22px 16px 7px}
.gf{font-size:13px;color:var(--sub);margin:7px 16px 0;line-height:1.45}
.group{background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:0 0 0 16px;width:100%;text-align:left;min-height:46px;position:relative;text-decoration:none;color:inherit}
.row:active,.it:active{background:var(--fill)}
.row .rb{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:11px 16px 11px 0;border-bottom:.5px solid var(--line);align-self:stretch}
.row:last-child .rb{border-bottom:0}
.row .rt{flex:1;min-width:0;font-size:17px}
.row .rv{color:var(--faint);font-size:17px}
.row.lock{opacity:.45}
.chev{color:#c4c4c7;flex:none}
.ic{width:32px;height:32px;border-radius:10px;background:linear-gradient(150deg,color-mix(in srgb,var(--c,#7d8a99) 8%,var(--card)),color-mix(in srgb,var(--c,#7d8a99) 24%,var(--card)));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c,#7d8a99) 20%,transparent),0 1px 2px color-mix(in srgb,var(--c,#7d8a99) 18%,transparent);display:grid;place-items:center;flex:none;color:var(--c,#7d8a99)}
.ic svg{width:20px;height:20px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 4px}
.sum div{background:var(--card);border-radius:12px;padding:11px 14px;font-size:13px;color:var(--sub)}
.sum b{display:block;font-size:22px;font-weight:700;color:var(--ink);letter-spacing:0}
.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:16px 16px 7px}
.toolbar .cnt{font-size:13px;color:var(--sub);text-transform:uppercase}
.tl{display:flex;gap:16px}
.sortsel{border:0;background:none;color:var(--acc);font-size:15px;-webkit-appearance:none;appearance:none;padding:0}
.list{background:var(--card);border-radius:12px;overflow:hidden}
.it{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:0 0 0 16px;cursor:pointer}
.it .ic{margin-top:11px}
.it .bdw{flex:1;min-width:0;display:flex;gap:10px;padding:10px 14px 10px 0;border-bottom:.5px solid var(--line)}
.it:last-child .bdw{border-bottom:0}
.it .bd{flex:1;min-width:0}
.it .t{font-size:17px;line-height:1.3;word-break:break-word}
.it .m{font-size:14px;color:var(--sub);margin-top:2px;word-break:break-word}
.it .r{flex:none;text-align:right;font-size:15px;color:var(--sub);display:flex;align-items:flex-start;gap:6px;padding-top:2px}
.it .r .chev{margin-top:2px}
.dlb{color:var(--acc);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--acc-soft)}
.badge{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12.5px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-bad{background:var(--bad-soft);color:var(--bad)}.b-mute{background:var(--fill);color:var(--sub)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--acc-soft);color:var(--acc);border-radius:999px;padding:5px 11px;font-size:14px;font-weight:500;text-decoration:none}
.pill svg{width:14px;height:14px}
.pill.g{background:var(--fill);color:var(--ink)}
.empty{text-align:center;color:var(--faint);padding:40px 10px}
.more{display:block;margin:14px auto;color:var(--acc);font-size:16px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s;z-index:30}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--sheet);border-radius:12px 12px 0 0;padding:6px 16px calc(var(--safe-b) + 24px);transform:translateY(105%);transition:transform .35s cubic-bezier(.32,.72,0,1);z-index:31;max-width:720px;margin:0 auto}
@media (prefers-color-scheme:light){.sheet{background:#f2f2f7}}
.sheet .kv,.sheet .group,.sheet .opts,.sheet .formg{background:var(--card)}
@media (prefers-color-scheme:dark){.sheet .kv,.sheet .group,.sheet .opts,.sheet .formg{background:#2c2c2e}}
.sheet{visibility:hidden;transition:transform .35s cubic-bezier(.32,.72,0,1),visibility 0s .35s}.sheet.on{transform:none;visibility:visible;transition:transform .35s cubic-bezier(.32,.72,0,1)}
.grab{width:36px;height:5px;border-radius:9px;background:rgba(127,127,127,.4);margin:0 auto 10px}
.shh{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.shh .x{color:var(--acc);font-size:17px}
.shh .x.b{font-weight:600}
.shh .x:disabled{opacity:.4}
.shh .tt{font-weight:600;font-size:17px;text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet h2{margin:6px 0 2px;font-size:22px;font-weight:700;line-height:1.3}
.kv{border-radius:12px;margin-top:14px;overflow:hidden}
.kv>div{display:flex;gap:10px;padding:11px 16px;align-items:center;position:relative}
.kv>div+div::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--line)}
.kv .k{width:34%;flex:none;font-size:15px;color:var(--sub)}
.kv .v{flex:1;min-width:0;word-break:break-word;font-size:16px}
.cp{flex:none;font-size:15px;color:var(--acc)}
.formg{border-radius:12px;overflow:hidden;margin-top:14px}
.f{display:flex;align-items:center;gap:10px;padding:0 16px;min-height:46px;position:relative}
.f+.f::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--line)}
.f label{width:36%;flex:none;font-size:15px;color:var(--sub)}
.f.area{align-items:flex-start;flex-direction:column;gap:2px;padding:10px 16px}
.f.area label{width:auto}
.f input,.f select,.f textarea{border:0;background:none;padding:11px 0;font-size:17px;outline:none;width:100%;flex:1;min-width:0;text-align:left;-webkit-appearance:none;appearance:none}
.f.area textarea{padding:4px 0;min-height:66px;resize:vertical}
.btnlist{border-radius:12px;overflow:hidden;margin-top:24px;background:var(--card)}
@media (prefers-color-scheme:dark){.btnlist{background:#2c2c2e}}
.btnlist button{display:block;width:100%;padding:13px 16px;text-align:center;font-size:17px;color:var(--acc);position:relative}
.btnlist button+button::before{content:"";position:absolute;top:0;left:0;right:0;border-top:.5px solid var(--line)}
.btnlist .d{color:var(--bad)}
.opts{border-radius:12px;overflow:hidden}
.opt{display:flex;align-items:center;gap:10px;padding:0 16px;min-height:44px;position:relative;text-align:left;cursor:pointer}
.opt+.opt::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--line)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt span{flex:1;font-size:16px;padding:10px 0}
.opt small{color:var(--faint);font-size:15px}
.opt i{width:20px;color:var(--acc);font-style:normal;font-weight:700;visibility:hidden}
.opt input:checked~i{visibility:visible}
.fgroup h3{font-size:13px;color:var(--sub);text-transform:uppercase;font-weight:400;margin:20px 16px 7px}
.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 10px);transform:translateX(-50%) translateY(-20px);background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:var(--ink);border-radius:999px;padding:10px 18px;font-size:15px;font-weight:500;opacity:0;transition:.25s;z-index:50;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.15)}
.toast.on{opacity:1;transform:translateX(-50%)}
.center{text-align:center;padding:60px 10px;color:var(--sub)}
.center .big{width:72px;height:72px;border-radius:22px;background:color-mix(in srgb,var(--acc) 14%,var(--card));color:var(--acc);display:grid;place-items:center;margin:0 auto}
.center .big svg{width:40px;height:40px}
.center h2{color:var(--ink);font-size:22px;margin:16px 0 6px}
.cta{display:inline-block;background:var(--acc);color:#fff;border-radius:12px;padding:14px 26px;font-weight:600;margin-top:22px;font-size:17px}
.pw{display:flex;align-items:center;gap:10px;background:var(--fill);border-radius:8px;padding:6px 10px;margin-top:8px}
.pw .v{flex:1;min-width:0;word-break:break-all;font-size:15px;letter-spacing:.1em}
.qr{display:grid;place-items:center;padding:18px;background:#fff;border-radius:12px;margin-top:14px}
.spin{width:24px;height:24px;border:2.5px solid var(--fill);border-top-color:var(--faint);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}

.hello{font-size:15px;color:var(--sub);margin:2px 4px 0}
.wgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.wgrid{grid-template-columns:repeat(3,1fr)}main{max-width:900px}.hin{max-width:900px}}
@media(min-width:640px){.wgrid.two{grid-template-columns:repeat(2,1fr)}}
.wd{background:var(--card);border-radius:18px;padding:14px 14px 13px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:146px;transition:transform .12s}
.wd:active{transform:scale(.97)}
.wd.lock{opacity:.45}
.wtop{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.wd .ic{width:44px;height:44px;border-radius:14px}
.wd .ic svg{width:26px;height:26px}
.wt{font-size:15px;font-weight:600;line-height:1.3;color:var(--sub)}
.wn{font-size:28px;font-weight:700;letter-spacing:-.01em;line-height:1.15;margin-top:auto}
.wn small{font-size:13px;font-weight:500;color:var(--faint);margin-left:5px}
.ws{font-size:12.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alert{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:12px 14px;width:100%;text-align:left}
.alert .ab{flex:1;min-width:0;display:flex;flex-direction:column}
.alert b{font-size:16px;font-weight:600}
.wrapn{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 2px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:8px 0 4px}

.tile{background:var(--card);border-radius:16px;padding:11px 14px;font-size:13px;color:var(--sub);min-width:0}
.tile b{display:block;font-size:21px;font-weight:700;color:var(--ink);letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.tile.ok b{color:var(--ok)}.tile.bad b{color:var(--bad)}
.acts2{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 2px}
.jcards{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.jcard{background:var(--card);border-radius:18px;padding:13px 15px;text-align:left;width:100%;display:block}
.jcard:active{transform:scale(.99)}
.jcard .h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.jcard .h b{font-size:16.5px}
.jcard .h small{display:block;color:var(--sub);font-size:13.5px;margin-top:2px;line-height:1.35}
.jcard .gp{text-align:right;flex:none}
.jcard .gp b{font-size:22px;display:block;line-height:1.1}
.jcard .gp small{font-size:12px;color:var(--faint)}
.jcard .m{font-size:12.5px;color:var(--sub);margin-top:8px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.cbar{margin-top:9px;display:grid;grid-template-columns:52px 1fr;gap:3px 8px;align-items:center;font-size:11.5px;color:var(--faint)}
.cbar i{display:block;height:8px;border-radius:6px;background:var(--fill);position:relative;overflow:hidden}
.cbar i span{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.cl-e{background:#8e8e93}.cl-a{background:var(--acc)}.cl-a.over{background:var(--bad)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.tbl{background:var(--card);border-radius:14px;overflow:hidden;font-size:14px}
.tbl .tr{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:6px;padding:9px 14px;border-top:.5px solid var(--line);align-items:center}
.tbl .tr:first-child{border-top:0}

.tbl .tr>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl .th{font-size:12px;color:var(--sub);text-transform:uppercase;background:color-mix(in srgb,var(--fill) 50%,transparent)}
.tbl .tot{font-weight:700;background:color-mix(in srgb,var(--fill) 50%,transparent)}
.tbl .warn{color:var(--warn);font-size:13px}
.tbl .big{font-size:16px}

.gh2{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin:22px 4px 7px}
.gh2 .l{font-size:13px;color:var(--sub);text-transform:uppercase}
.gh2 .l b{color:var(--ink);font-weight:600;text-transform:none;font-size:15px;display:block}
.gh2 .r{display:flex;gap:14px;font-size:15px;color:var(--acc);flex-wrap:wrap;justify-content:flex-end}
.gh2 .r button{color:var(--acc)}
.gh2 .r .d{color:var(--bad)}
.rowx{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:10px 14px;border-top:.5px solid var(--line)}
.rowx:first-child{border-top:0}
.rowx:active{background:var(--fill)}
.rowx .bd{flex:1;min-width:0}
.rowx .t{font-size:15.5px;line-height:1.3;word-break:break-word}
.rowx .m{font-size:12.5px;color:var(--sub);margin-top:2px;word-break:break-word}
.rowx .a{flex:none;font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;text-align:right}
.tag{display:inline-block;border-radius:5px;padding:0 6px;font-size:11.5px;font-weight:600;background:var(--fill);color:var(--sub);margin-right:4px}

.tag.a{background:var(--acc-soft);color:var(--acc)}

.infog .k{width:34%;flex:none;color:var(--sub)}
.infog .v{flex:1;min-width:0;word-break:break-word}

.scx{overflow-x:auto;border-radius:12px}

const LIB={xl:['https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js','ExcelJS'],h2c:['https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js','html2canvas'],pdf:['https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js','jspdf']};

const CHEV='<svg class="chev" width="8" height="13" viewBox="0 0 8 13"><path d="M1.5 1.5 6.5 6.5 1.5 11.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const N=v=>{if(v==null||v==='')return 0;if(typeof v==='number')return isFinite(v)?v:0;let s=String(v).trim().replace(/[,\s฿]/g,'').replace(/บาท/g,'');const neg=/^\(.*\)$/.test(s)||/-$/.test(s);s=s.replace(/[()]/g,'').replace(/-$/,'');const n=parseFloat(s);return isNaN(n)?0:(neg?-Math.abs(n):n)};

const CFGA={clientId:"73241ae0-9aa1-49fe-b2c7-caa2449a0091",tenantId:"410b700e-bb2a-46d2-b4c0-449aec007d0e",siteUrl:"https://unboffice.sharepoint.com/sites/ITPortal"};
const SCOPES=['User.Read','Sites.ReadWrite.All'];

async function token(){try{return (await msal.acquireTokenSilent({scopes:SCOPES,account})).accessToken}catch(e){await msal.acquireTokenRedirect({scopes:SCOPES,account});throw e}}
async function g(path,opt={}){
  const t=await token();const headers={Authorization:'Bearer '+t,...(opt.headers||{})};let body;
  if(opt.json){headers['Content-Type']='application/json';body=JSON.stringify(opt.json)}
  const r=await fetch(path.startsWith('http')?path:'https://graph.microsoft.com/v1.0'+path,{method:opt.method||'GET',headers,body});
  if(!r.ok){let b='';try{b=await r.text()}catch(_){};let m='';try{m=JSON.parse(b).error.message}catch(_){};const err=new Error(r.status===403?'ไม่มีสิทธิ์แก้ไขข้อมูลใน SharePoint (ติดต่อ IT)':(opt.method||'GET')+' '+path.split('?')[0]+(m?' : '+m:''));err.status=r.status;throw err}
  return r.status===204?null:r.json();
}
const titleOf=r=>r.type==='cfg'?'cfg':((r.so||r.jo||'JOB')+' '+(r.cust||'')).trim();
const store={
  async load(){
    if(DEMO)return JSON.parse(localStorage.getItem('jc-demo')||'[]');
    const id=lists[LIST];let rows=[],next=`/sites/${siteId}/lists/${id}/items?$expand=fields($select=Title,Data)&$top=999`;
    while(next){const r=await g(next);r.value.forEach(it=>{let d={};try{d=JSON.parse(it.fields.Data||'{}')}catch(e){}rows.push({...d,_id:it.id})});next=r['@odata.nextLink']}
    return rows;
  },
  async save(r){
    const {_id,...d}=r;d.upd=new Date().toISOString();d.by=me;
    if(DEMO){if(_id){const i=DATA.findIndex(x=>x._id===_id);DATA[i]={...d,_id}}else{r._id='d'+Date.now()+Math.random().toString(36).slice(2,7);DATA.push({...d,_id:r._id})}localStorage.setItem('jc-demo',JSON.stringify(DATA));return r._id}
    const js=JSON.stringify(d);
    const fields={Title:String(titleOf(d)||'-').slice(0,250),Data:js};const id=lists[LIST];
    if(_id){await g(`/sites/${siteId}/lists/${id}/items/${_id}/fields`,{method:'PATCH',json:fields});const i=DATA.findIndex(x=>x._id===_id);DATA[i]={...d,_id};return _id}
    const it=await g(`/sites/${siteId}/lists/${id}/items`,{method:'POST',json:{fields}});DATA.push({...d,_id:it.id});return it.id;
  },
  async del(_id){
    if(!DEMO)await g(`/sites/${siteId}/lists/${lists[LIST]}/items/${_id}`,{method:'DELETE'});
    DATA=DATA.filter(x=>x._id!==_id);if(DEMO)localStorage.setItem('jc-demo',JSON.stringify(DATA));
  }
};

/* ===== Categories (from Summary sheet) ===== */
const DEF_CFG={type:'cfg',dm:['Structures (เหล็ก)','Standard Part','Electronic ไฟฟ้า','Non Standard Part UNB','สายพาน','ชุบอะไหล่','Pneumatic','Motor','จ้างทำ Part','ประเมินราคา'],dl:['ออกแบบ','Laser','Bending','ตัดเหล็ก','กลึง','มิลลิ่ง','CNC','ย้ำ Roller , Shaft','เชื่อม','ประกอบ','ทำสี','ส่งมอบงาน','ติดตั้งงาน','OT+เบี้ยเลี้ยง'],oh:['ค่าไฟฟ้า','ค่าน้ำประปา','ค่าที่พักติดตั้งงาน','ค่าจัดส่งสินค้า'],dep:5,exp:5};
const CFG=()=>({...DEF_CFG,...(DATA.find(r=>r.type==='cfg')||{})});
const JOBS=()=>DATA.filter(r=>r.type==='job');
const GRP={dm:'วัตถุดิบ (DM)',dl:'ค่าแรง (DL)',oh:'ค่าโสหุ้ย (OH)'};
const SEC={
  'est.dm':{t:'วัตถุดิบ (DM)',cols:['code','name','unit','qty','cost','amt','cat','doc']},
  'est.dl':{t:'ค่าแรง (DL)',cols:['code','name','cat','ppl','unit','qty','cost','amt']},
  'est.oh':{t:'ค่าโสหุ้ย (OH)',cols:['code','name','cat','amt']},
  'act.dm':{t:'วัตถุดิบ (DM) · เบิกใช้ WMS / WIN',cols:['src','code','name','type','unit','qty','cost','amt','note','cat']},
  'act.dl':{t:'ค่าแรง (DL) · WIN',cols:['date','name','cat','amt']},
  'act.oh':{t:'ค่าโสหุ้ย (OH)',cols:['code','name','cat','amt']}
};

const COLN={code:'รหัส',name:'รายการ / ชื่อ',unit:'หน่วย',qty:'จำนวน',cost:'ราคาต่อหน่วย',amt:'จำนวนเงิน',cat:'หมวด',doc:'เลขที่เอกสาร',ppl:'จำนวนคน',src:'ที่มา',type:'ประเภท',note:'หมายเหตุ',date:'วันที่'};
const catName=sec=>sec.endsWith('.dl')?'แผนก / ขั้นตอน':sec.endsWith('.oh')?'หมวด (หมายเหตุ)':'หมวด';
const NUMC=['qty','cost','amt','ppl'];
const rowsOf=(j,sec)=>{const [s,k]=sec.split('.');j[s]=j[s]||{};j[s][k]=j[s][k]||[];return j[s][k]};

/* ===== Cost calculation (same rules as Summary sheet) ===== */
function calc(j){
  const c=CFG();const dep=(j.dep??c.dep)/100,exp=(j.exp??c.exp)/100;
  const by=(rows,cats)=>{const m=cats.map(()=>0);let un=0,unN=0;(rows||[]).forEach(r=>{const a=N(r.amt);const i=cats.findIndex(x=>nk(x)===nk(r.cat));if(i<0){if(a){un+=a;unN++}}else m[i]+=a});return {m,un,unN,sum:m.reduce((a,b)=>a+b,0)}};
  const side=s=>{const o=j[s]||{};const dm=by(o.dm,c.dm),dl=by(o.dl,c.dl),oh=by(o.oh,c.oh);const base=dm.sum+dl.sum;const d=base*dep,e=base*exp;const ohT=d+e+oh.sum;return {dm,dl,oh,dep:d,exp:e,ohT,total:base+ohT,n:['dm','dl','oh'].reduce((a,k)=>a+(o[k]||[]).length,0)}};
  const E=side('est'),A=side('act');const p=N(j.price);
  return {c,E,A,price:p,depP:dep*100,expP:exp*100,gpE:p?(p-E.total)/p:null,gpA:p?(p-A.total)/p:null,prE:p-E.total,prA:p-A.total,diff:E.total-A.total,hasA:A.n>0,over:A.n>0&&A.total>E.total+0.005};
}
const stName=s=>s==='done'?'ปิดงาน':'กำลังผลิต';

/* ===== Header ===== */
function setHeader(){

  b.onclick=()=>go('list');

  if(mode==='ready'&&!j){t=`<div class="sbar"><label class="search"><svg width="16" height="16" viewBox="0 0 16 16"><circle cx="7" cy="7" r="5.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m11 11 3.5 3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><input id="q" type="search" placeholder="ค้นหา SO / JO / ลูกค้า / สินค้า / Sales" value="${esc(ST.q)}"></label></div>
    <div class="seg">${[['all','ทั้งหมด'],['open','กำลังผลิต'],['done','ปิดงาน'],['over','เกินประเมิน']].map(([k,l])=>`<button data-flt="${k}" class="${ST.flt===k?'on':''}">${l}</button>`).join('')}</div>`}
  if(mode==='ready'&&j){t=`<div class="seg">${[['sum','สรุป'],['est','ต้นทุนประเมิน'],['act','ต้นทุนจริง']].map(([k,l])=>`<button data-tab="${k}" class="${ST.tab===k?'on':''}">${l}</button>`).join('')}</div>`}
  $('tools').innerHTML=t;
  const q=$('q');if(q)q.oninput=()=>{ST.q=q.value;renderMain()};
  document.querySelectorAll('[data-flt]').forEach(x=>x.onclick=()=>{ST.flt=x.dataset.flt;render()});

function syncHash(){const h=ST.view==='job'?'#job='+encodeURIComponent(ST.id)+(ST.tab!=='sum'?'&t='+ST.tab:''):'';if(location.hash!==h)history.replaceState(null,'',location.pathname+location.search+h)}

function render(){
  setHeader();const M=$('main');
  if(mode==='loading'){M.innerHTML='<div class="center"><div class="spin"></div></div>';return}
  if(mode==='signin'){M.innerHTML='<div class="center"><h2>เข้าสู่ระบบด้วยบัญชีบริษัท</h2><div>ใช้อีเมลและรหัสผ่าน Microsoft 365</div><button class="cta" id="login">เข้าสู่ระบบ Microsoft 365</button></div>';$('login').onclick=()=>msal.loginRedirect({scopes:SCOPES});return}
  if(mode==='err'){M.innerHTML=`<div class="center"><h2>เชื่อมต่อไม่สำเร็จ</h2><div style="font-size:14px">${esc(errMsg)}</div><button class="cta" id="retry">ลองใหม่</button></div>`;$('retry').onclick=()=>location.reload();return}

  if(ST.view==='job'){const j=JOBS().find(x=>x._id===ST.id);if(!j){ST.view='list';syncHash();return render()}return renderJob(j)}

/* ===== Job list ===== */
function renderList(){
  const all=JOBS().map(j=>({j,c:calc(j)}));
  const q=nk(ST.q);
  let L=all.filter(({j,c})=>(ST.flt==='all'||(ST.flt==='over'?c.over:(j.status||'open')===ST.flt))&&(!q||nk([j.so,j.jo,j.doc,j.cust,j.pname,j.pcode,j.sales].join(' ')).includes(q)));
  const S={upd:(a,b)=>String(b.j.upd||'').localeCompare(String(a.j.upd||'')),so:(a,b)=>String(b.j.so||'').localeCompare(String(a.j.so||'')),gp:(a,b)=>(a.c.hasA?a.c.gpA:a.c.gpE??9)-(b.c.hasA?b.c.gpA:b.c.gpE??9),price:(a,b)=>b.c.price-a.c.price,diff:(a,b)=>a.c.diff-b.c.diff}[ST.sort];L.sort(S);
  const sumP=L.reduce((a,x)=>a+x.c.price,0),withA=L.filter(x=>x.c.hasA),pA=withA.reduce((a,x)=>a+x.c.price,0),cA=withA.reduce((a,x)=>a+x.c.A.total,0),pE=L.reduce((a,x)=>a+x.c.price,0),cE=L.reduce((a,x)=>a+x.c.E.total,0);
  const gA=pA?(pA-cA)/pA:null,gE=pE?(pE-cE)/pE:null,nOver=L.filter(x=>x.c.over).length;
  let h=`<div class="tiles"><div class="tile">จำนวนงาน<b>${L.length}</b><small>${L.filter(x=>(x.j.status||'open')==='open').length} กำลังผลิต · ${L.filter(x=>x.j.status==='done').length} ปิดงาน</small></div>
   <div class="tile">ยอดขายรวม<b>${f0(sumP)}</b><small>บาท</small></div>
   <div class="tile ${gA==null?'':gA>=gE-1e-9?'ok':'bad'}">GP% จริง (ถ่วงน้ำหนัก)<b>${pct(gA)}</b><small>ประเมิน ${pct(gE)}</small></div>
   <div class="tile ${nOver?'bad':''}">ต้นทุนจริงเกินประเมิน<b>${nOver}</b><small>งาน</small></div></div>
   <div class="acts2"><button class="pill" id="imp">⬆︎ นำเข้า Excel / CSV</button><button class="pill g" id="xall">⬇︎ Excel สรุปทุกงาน</button>
   <select class="sortsel" id="sort" style="margin-left:auto">${[['upd','ล่าสุด'],['so','เลขที่ SO'],['gp','GP% ต่ำ → สูง'],['price','ราคาขายสูงสุด'],['diff','เกินประเมินมากสุด']].map(([k,l])=>`<option value="${k}" ${ST.sort===k?'selected':''}>เรียง: ${l}</option>`).join('')}</select></div>
   <label class="drop" id="drop"><b>ลากไฟล์มาวางที่นี่</b><span>.xlsx ใบสรุปต้นทุน (Summary / ต้นทุนประเมิน / ต้นทุนจริง) ได้หลายไฟล์ · หรือ .csv เพื่อเพิ่มรายการเข้างาน</span><input type="file" id="fi" accept=".xlsx,.xlsm,.csv,.txt" multiple hidden></label>`;
  if(!L.length)h+=`<div class="empty">${JOBS().length?'ไม่พบงานที่ตรงกับเงื่อนไข':'ยังไม่มีงาน — นำเข้าไฟล์ Excel ใบสรุปต้นทุน หรือกด + เพื่อสร้างงานใหม่'}</div>`;
  else h+='<div class="jcards">'+L.map(({j,c})=>{const mx=Math.max(c.price,c.E.total,c.A.total,1);const g=c.hasA?c.gpA:c.gpE;
    return `<button class="jcard" data-id="${esc(j._id)}"><div class="h"><div style="min-width:0"><b>${esc(j.so||j.jo||'(ไม่มีเลขที่)')}</b> <span class="badge ${j.status==='done'?'b-mute':'b-ok'}">${stName(j.status)}</span>${c.over?' <span class="badge b-bad">เกินประเมิน</span>':''}
      <small>${esc(j.cust||'-')}</small><small>${esc([j.pname,j.qty?j.qty+' '+(j.unit||''):''].filter(Boolean).join(' · '))}</small></div>

function wireDrop(el,inp,job){

function sumHTML(j,c){

  let h=`<div class="mixw">${mix(c.E,'ประเมิน')}${c.hasA?mix(c.A,'จริง'):''}<span></span><div class="legend"><span><i style="background:#0a84ff"></i>DM วัตถุดิบ</span><span><i style="background:#ff9f0a"></i>DL ค่าแรง</span><span><i style="background:#bf5af2"></i>OH โสหุ้ย</span></div><span></span></div>`;
  h+=`<div class="gh2"><span class="l">แยกตามหมวด</span><label class="r" style="color:var(--sub);font-size:14px;align-items:center;gap:6px"><input type="checkbox" id="hz" ${H0?'checked':''}> ซ่อนหมวดที่เป็น 0</label></div>`;
  h+=`<div class="tbl">${head('วัตถุดิบ (DM)')}${cf.dm.map((n,i)=>line(n,c.E.dm.m[i],c.A.dm.m[i])).join('')}${unm('dm')}${line('รวม DM',c.E.dm.sum,c.A.dm.sum,'tot')}</div>`;
  h+=`<div class="tbl" style="margin-top:10px">${head('ค่าแรง (DL)')}${cf.dl.map((n,i)=>line(n,c.E.dl.m[i],c.A.dl.m[i])).join('')}${unm('dl')}${line('รวม DL',c.E.dl.sum,c.A.dl.sum,'tot')}</div>`;
  h+=`<div class="tbl" style="margin-top:10px">${head('ค่าโสหุ้ย (OH)')}${line(`ค่าเสื่อมราคา ${fm(c.depP,0)}% ของต้นทุน`,c.E.dep,c.A.dep)}${line(`ค่าใช้จ่าย ${fm(c.expP,0)}% ของต้นทุน`,c.E.exp,c.A.exp)}${cf.oh.map((n,i)=>line(n,c.E.oh.m[i],c.A.oh.m[i])).join('')}${unm('oh')}${line('รวม OH',c.E.ohT,c.A.ohT,'tot')}</div>`;

  h+=`<div class="note2">ส่วนต่าง = ประเมิน − จริง · สีแดง = ต้นทุนจริงสูงกว่าที่ประเมิน · ค่าเสื่อมราคาและค่าใช้จ่าย คิด ${fm(c.depP,0)}% / ${fm(c.expP,0)}% ของ (DM + DL) แบบเดียวกับไฟล์ Excel${(c.E.dm.unN+c.E.dl.unN+c.E.oh.unN+c.A.dm.unN+c.A.dl.unN+c.A.oh.unN)?' · ⚠︎ มีรายการที่หมวดไม่ตรงกับรายชื่อหมวด จึงไม่ถูกนับรวม (เหมือน SUMIF ใน Excel) — กดแท็บต้นทุนประเมิน/จริง เพื่อแก้หมวด':''}</div>`;
  h+=infoHTML(j);
  return h;
}

/* ===== Reading files ===== */
const cellV=v=>{if(v==null)return '';if(v instanceof Date)return v;if(typeof v==='object'){if(v.richText)return v.richText.map(x=>x.text).join('');if('result' in v)return v.result==null?'':(v.result.error?'':v.result);if(v.text!=null)return v.text;if(v.error)return '';return ''}return v};
const isoD=v=>{if(v==null||v==='')return '';if(v instanceof Date){let y=v.getUTCFullYear();if(y>2400)y-=543;return y+'-'+pad2(v.getUTCMonth()+1)+'-'+pad2(v.getUTCDate())}
  const s=String(v).trim();let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m){let y=+m[1];if(y>2400)y-=543;return y+'-'+pad2(m[2])+'-'+pad2(m[3])}
  m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);if(m){let y=+m[3];if(y<100)y+=y>50?2400:2000;if(y>2400)y-=543;return y+'-'+pad2(m[2])+'-'+pad2(m[1])}
  if(/^\d{5}(\.\d+)?$/.test(s)){const d=new Date(Math.round((+s-25569)*864e5));return isoD(d)}return s};
async function decodeText(buf){const u=new Uint8Array(buf);try{return new TextDecoder('utf-8',{fatal:true}).decode(u).replace(/^﻿/,'')}catch(e){try{return new TextDecoder('windows-874').decode(u)}catch(_){return new TextDecoder('utf-8').decode(u)}}}
function parseCSV(t){
  const first=t.split(/\r?\n/).slice(0,5).join('\n');const cnt=d=>(first.match(new RegExp(d==='\t'?'\\t':'\\'+d,'g'))||[]).length;const dl=[',',';','\t','|'].sort((a,b)=>cnt(b)-cnt(a))[0];
  const out=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch;continue}
    if(ch==='"'){q=true;continue}
    if(ch===dl){row.push(f);f='';continue}
    if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(f);out.push(row);row=[];f='';continue}
    f+=ch}
  if(f!==''||row.length){row.push(f);out.push(row)}
  return out;
}
function wsGrid(ws){const g=[];const R=ws.rowCount,C=ws.columnCount;for(let r=1;r<=R;r++){const a=[];for(let c=1;c<=C;c++)a.push(cellV(ws.getCell(r,c).value));g.push(a)}return g}
async function readBook(f){await need('xl');const wb=new ExcelJS.Workbook();await wb.xlsx.load(await f.arrayBuffer());return wb}

/* column auto-mapping by header text */
const SYN={code:['รหัส','sku','code','รหัสวัตถุดิบ','รหัสพนักงาน','รหัสค่าใช้จ่าย','รหัสสินค้า','itemcode','รหัสบัญชี'],
  name:['ชื่อ','รายการ','รายละเอียด','description','ชื่อวัตถุดิบ','ชื่อพนักงาน','ชื่อค่าใช้จ่าย','ชื่อสินค้า','itemname','name','remark'],
  unit:['หน่วย','หน่วยนับ','หน่วยค่าแรง','unit','uom'],qty:['จำนวน','qty','quantity','จำนวนที่เบิก'],
  cost:['ราคา','ต้นทุนต่อหน่วย','ค่าแรงต่อหน่วย','ราคาต่อหน่วย','unitprice','unitcost','price','cost'],
  amt:['จำนวนเงิน','totaamnt','totalamount','totalamnt','amount','มูลค่า','ยอดเงิน','รวมเงิน','total'],
  cat:['หมวด','แผนก','category','department','dept','ขั้นตอน'],doc:['เลขที่เอกสาร','docno','เอกสาร'],ppl:['จำนวนคน','คน'],
  type:['ประเภท','type'],note:['หมายเหตุ','note'],date:['docudate','วันที่','date','วันที่เอกสาร'],src:['ที่มา','source']};
function synFor(sec,c){let s=SYN[c].slice();
  if(sec.endsWith('.oh')&&c==='cat')s=['หมายเหตุ',...s];
  if(sec==='act.dl'&&c==='name')s=['remark','ชื่อพนักงาน',...s];
  if(sec==='act.dl'&&c==='cat')s=['แผนก',...s];
  return s.map(hk)}
function autoMap(headers,sec){
  const cols=SEC[sec].cols;const H=headers.map(hk);const used=new Set();const m={};
  const order=['amt','ppl','cost','qty',...cols.filter(c=>!['amt','ppl','cost','qty'].includes(c))].filter(c=>cols.includes(c));
  for(const pass of [0,1])for(const c of order){if(m[c]!=null)continue;for(const s of synFor(sec,c)){const i=H.findIndex((h,ix)=>!used.has(ix)&&h&&(pass?(h.includes(s)&&s.length>=2):h===s));if(i>=0){m[c]=i;used.add(i);break}}}
  return m}
function findHeaderRow(grid,sec){let best=-1,bs=0;for(let r=0;r<Math.min(grid.length,15);r++){const n=Object.keys(autoMap(grid[r].map(x=>String(x??'')),sec)).length;if(n>bs){bs=n;best=r}}return bs>=2?best:-1}
function rowsFromGrid(grid,hr,map,sec,extra={}){
  const out=[];for(let r=hr+1;r<grid.length;r++){const a=grid[r]||[];const o={...extra};let any=false;
    for(const [c,i] of Object.entries(map)){if(i==null||i<0)continue;let v=a[i];if(v==null||v==='')continue;
      if(NUMC.includes(c))v=r2(N(v));else if(c==='date')v=isoD(v);else v=(v instanceof Date?isoD(v):String(v)).replace(/\s+/g,' ').trim();
      if(v===''||(NUMC.includes(c)&&v===0&&c!=='amt'))continue;o[c]=v;any=true}
    if(!any)continue;
    const first=nk(Object.values(o)[0]);if(['total','รวม','ยอดรวม','grand total'].includes(nk(o.code))||['total','รวม','ยอดรวม'].includes(nk(o.name))||(!o.name&&!o.code&&nk(a.find(x=>x!==''&&x!=null))==='total'))continue;
    if(o.amt==null&&N(o.qty)&&N(o.cost))o.amt=r2(N(o.qty)*N(o.cost)*(o.ppl?N(o.ppl):1));
    if(!o.name&&!o.code&&!N(o.amt))continue;
    if(!o.name&&!o.code&&!o.cat&&!N(o.qty)&&out.length&&Math.abs(N(o.amt)-out.reduce((x,y)=>x+N(y.amt),0))<0.01)continue;
    if(o.amt==null)o.amt=0;
    out.push(o)}
  return out}

/* standard workbook: Summary + ต้นทุนประเมิน + ต้นทุนจริง */
const isStd=wb=>!!(wb.getWorksheet('ต้นทุนประเมิน')||wb.getWorksheet('ต้นทุนจริง'));
function blocks(grid,kind){
  const t=grid[0]||[];const starts=[];t.forEach((v,i)=>{const x=String(v??'').trim();if(x&&(i===0||String(t[i-1]??'').trim()!==x))starts.push(i)});
  const res=[];starts.forEach((s,ix)=>{const e=ix+1<starts.length?starts[ix+1]:Math.max(t.length,(grid[1]||[]).length);const title=nk(t[s]);let sec=null,extra={};
    if(kind==='est'){sec=title.includes('ค่าแรง')?'est.dl':title.includes('โสหุ้ย')?'est.oh':'est.dm'}
    else{if(title.includes('โสหุ้ย'))sec='act.oh';else if(title.includes('ค่าแรง'))sec='act.dl';else{sec='act.dm';extra={src:title.includes('wms')?'WMS':title.includes('win')?'WIN':'WMS'}}}
    const sub=grid.map(r=>(r||[]).slice(s,e));const map=autoMap(sub[1]||[],sec);res.push({sec,rows:rowsFromGrid(sub,1,map,sec,extra),title:String(t[s])})});
  return res}
function parseStd(wb,fname){
  const j={type:'job',status:'open',est:{dm:[],dl:[],oh:[]},act:{dm:[],dl:[],oh:[]}};const newCats={dm:[],dl:[],oh:[]};
  const S=wb.getWorksheet('Summary');
  if(S){const G=wsGrid(S);const lab=(re,maxR=G.length)=>{for(let r=0;r<Math.min(G.length,maxR);r++){const a=G[r];for(let c=0;c<a.length;c++){if(re.test(nk(a[c]))){for(let k=c+1;k<a.length;k++){const v=a[k];if(v!==''&&v!=null)return {v,r,c:k,a}}return {v:'',r,c,a}}}}return null};
    const L=(re,m)=>{const x=lab(re,m);return x?x.v:''};
    j.sales=String(L(/^sales?$/,8)||'').trim();j.cust=String(L(/^ลูกค้า$/,8)||'').trim();j.pcode=String(L(/^รหัสสินค้า$/,8)||'').trim();j.pname=String(L(/^รายการสินค้า$/,8)||'').trim();
    const q=lab(/^จำนวน$/,8);if(q){j.qty=N(q.v)||'';const u=q.a.slice(q.c+1).find(x=>x!==''&&x!=null);if(u&&nk(u)!=='หน่วย')j.unit=String(u).trim()}
    j.jo=String(L(/^เลขที่ใบสั่งผลิต$/,8)||'').trim();j.odate=isoD(L(/^วันที่สั่งผลิต$/,8));j.doc=String(L(/^เลขที่เอกสาร$/,8)||'').trim();
    const pr=lab(/^ราคาขาย$/);if(pr)j.price=r2(N(pr.v));
    const catsAfter=re=>{for(let r=0;r<G.length;r++){if(re.test(nk(G[r][0]))){const out=[];for(let k=r+1;k<G.length;k++){const v=String(G[k][1]??'').replace(/\s+/g,' ').trim();if(!v)break;out.push(v)}return out}}return []};
    newCats.dm=catsAfter(/^รหัสวัตถุดิบ/);newCats.dl=catsAfter(/^รหัสขั้นตอน/);const oh=catsAfter(/^รหัสบัญชี/);
    oh.forEach(v=>{const m=v.match(/(\d+(?:\.\d+)?)\s*%/);if(m&&/เสื่อม/.test(v))j.dep=+m[1];else if(m&&/ค่าใช้จ่าย/.test(v))j.exp=+m[1];else if(!m)newCats.oh.push(v)})}
  const ES=wb.getWorksheet('ต้นทุนประเมิน'),AC=wb.getWorksheet('ต้นทุนจริง');
  if(ES)blocks(wsGrid(ES),'est').forEach(b=>rowsOf(j,b.sec).push(...b.rows));
  if(AC)blocks(wsGrid(AC),'act').forEach(b=>rowsOf(j,b.sec).push(...b.rows));
  const fm1=String(fname||'').match(/S[O][A-Z]?\d{4}-\d{3}(?:-\d+)?/i);
  j.so=fm1?fm1[0].toUpperCase():(j.jo?j.jo.replace(/^J/i,'S'):'');
  const cf=CFG();if(j.dep===cf.dep)delete j.dep;if(j.exp===cf.exp)delete j.exp;
  return {j,newCats}}

/* ===== Import flow ===== */
async function importFiles(files,curJob){
  const jobsIn=[],others=[];
  for(const f of files){
    try{if(/\.(xlsx|xlsm)$/i.test(f.name)){const wb=await readBook(f);if(isStd(wb)&&!(curJob&&IMP_SEC)){jobsIn.push({f,...parseStd(wb,f.name)})}else others.push({f,wb})}
      else others.push({f})}catch(e){toast(f.name+': '+e.message)}}
  const sec=IMP_SEC;IMP_SEC=null;
  if(jobsIn.length)return confirmJobs(jobsIn,curJob,others,sec);
  if(others.length)return mapper(others[0],curJob,sec,others.slice(1));
}

  <tr class="sh"><td colspan="4">รายละเอียด OH (ค่าโสหุ้ย)</td></tr>${row(`ค่าเสื่อมราคา ${fm(c.depP,0)}% ของต้นทุน`,c.E.dep,c.A.dep)}${row(`ค่าใช้จ่าย ${fm(c.expP,0)}% ของต้นทุน`,c.E.exp,c.A.exp)}${cf.oh.map((x,i)=>row(x,c.E.oh.m[i],c.A.oh.m[i])).join('')}${c.E.oh.unN||c.A.oh.unN?`<tr><td style="color:#a60">ไม่ตรงหมวด (ไม่นับรวม)</td><td class="n">${c.E.oh.unN?n(c.E.oh.un):''}</td><td class="n">${c.A.oh.unN?n(c.A.oh.un):''}</td><td></td></tr>`:''}${row('รวม OH',c.E.ohT,c.A.ohT,'tot')}</table>
  <table class="gt"><tr><th></th><th>ประเมิน</th><th>จริง</th></tr><tr><td><b>ราคาต้นทุนรวม</b></td><td class="n">${n(c.E.total)}</td><td class="n">${c.hasA?n(c.A.total):'–'}</td></tr>

  <div class="ft"><span>${esc(j.so||j.jo||'')} · พิมพ์ ${thDate(today())}</span><span>ต้นทุนงาน · UNB</span></div></div>`;
}
async function renderCanvas(j){await need('h2c');const box=document.createElement('div');box.style.cssText='position:fixed;left:-10000px;top:0;z-index:-1';box.innerHTML=`<style>${RP_CSS}</style>`+reportHTML(j);document.body.appendChild(box);
  try{if(document.fonts)await document.fonts.ready;return await html2canvas(box.querySelector('.jcf'),{scale:2,backgroundColor:'#fff',useCORS:true})}finally{box.remove()}}
async function pdfJob(j){toast('กำลังสร้าง PDF…');const cv=await renderCanvas(j);await need('pdf');const pdf=new window.jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const h=Math.min(297,cv.height/cv.width*210);pdf.addImage(cv.toDataURL('image/jpeg',.92),'JPEG',0,0,210,h);saveFile(pdf.output('blob'),fileBase(j)+' สรุปต้นทุน.pdf');toast('ดาวน์โหลด PDF แล้ว')}
function printJob(j){const w=window.open('','_blank');if(!w){toast('เบราว์เซอร์บล็อกหน้าต่างใหม่');return}
  w.document.open();w.document.write(`<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><title>${esc(fileBase(j))} สรุปต้นทุน</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet"><style>@page{size:A4 portrait;margin:0}html,body{margin:0;background:#fff}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}${RP_CSS}.jcf{height:1122px;min-height:0;overflow:hidden}</style></head><body>${reportHTML(j)}<script>(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>setTimeout(()=>window.print(),300))<\/script></body></html>`);w.document.close()}

/* ===== Boot ===== */
async function boot(){
  readHash();
  if(DEMO){lists={[LIST]:'demo'};me='ทดลอง (demo)';DATA=await store.load();mode='ready';render();return}
  try{
    msal=new window.msal.PublicClientApplication({auth:{clientId:CFGA.clientId,authority:'https://login.microsoftonline.com/'+CFGA.tenantId,redirectUri:location.origin+location.pathname},cache:{cacheLocation:'localStorage'}});
    await msal.handleRedirectPromise().catch(()=>{});
    account=msal.getActiveAccount()||msal.getAllAccounts()[0]||null;
    if(!account){mode='signin';render();return}
    msal.setActiveAccount(account);me=account.name||account.username;
    const u=new URL(CFGA.siteUrl);siteId=(await g(`/sites/${u.hostname}:${u.pathname}`)).id;
    let next=`/sites/${siteId}/lists?$select=id,displayName&$top=200`;
    while(next){const r=await g(next);r.value.forEach(l=>lists[l.displayName]=l.id);next=r['@odata.nextLink']}
    if(!lists[LIST])throw new Error(`ยังไม่มีรายการ “${LIST}” ใน SharePoint ITPortal — แจ้งผู้ดูแลระบบ`);
    DATA=await store.load();mode='ready';render();
  }catch(e){errMsg=e.message;mode='err';render()}
}
